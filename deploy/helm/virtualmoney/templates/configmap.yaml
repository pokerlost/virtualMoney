apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "virtualmoney.fullname" . }}
  labels:
    {{- include "virtualmoney.labels" . | nindent 4 }}
data:
  VIRTUALMONEY_APPLICATION__ENVIRONMENT: {{ .Values.application.environment | quote }}
  VIRTUALMONEY_APPLICATION__OPENAPI_ENABLED: {{ .Values.application.openapiEnabled | quote }}
  VIRTUALMONEY_DATABASE__COMMAND_TIMEOUT_SECONDS: >-
    {{ .Values.database.commandTimeoutSeconds }}
  VIRTUALMONEY_DATABASE__POOL_TIMEOUT_SECONDS: >-
    {{ .Values.database.poolTimeoutSeconds }}
  VIRTUALMONEY_DATABASE__POOL_SIZE: {{ .Values.database.poolSize | quote }}
  VIRTUALMONEY_DATABASE__MAX_OVERFLOW: {{ .Values.database.maxOverflow | quote }}
  VIRTUALMONEY_PAGINATION__DEFAULT_LIMIT: {{ .Values.pagination.defaultLimit | quote }}
  VIRTUALMONEY_PAGINATION__MAXIMUM_LIMIT: {{ .Values.pagination.maximumLimit | quote }}
  VIRTUALMONEY_LOGFIRE__ENABLED: {{ .Values.logfire.enabled | quote }}
  VIRTUALMONEY_LOGFIRE__SEND_TO_LOGFIRE: {{ .Values.logfire.sendToLogfire | quote }}
  VIRTUALMONEY_LOGFIRE__CONSOLE: {{ .Values.logfire.console | quote }}
  VIRTUALMONEY_LOGFIRE__MINIMUM_LEVEL: {{ .Values.logfire.minimumLevel | quote }}
