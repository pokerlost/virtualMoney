[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "virtualMoney"
version = "0.2.1.dev0"
description = "Pokerlost virtualMoney foundation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.38,<1", "pydantic-settings>=2.12,<3", "pypokerlost", "typer>=0.16,<1"]

[project.scripts]
virtualMoney = "virtualmoney.cli:cli"

[dependency-groups]
dev = ["mypy>=2.3,<3", "ruff==0.16.4", "packaging>=25,<27", "hatchling>=1.27,<2", "pytest>=9,<10", "pytest-cov>=7,<8", "httpx>=0.28,<1", "pre-commit>=4.2,<5"]

[tool.hatch.build]
exclude = [".aws", ".aws/**", ".agents", ".agents/**", ".codex", ".codex/**", ".serena", ".serena/**", ".local", ".local/**", "backups", "backups/**", ".env", ".env.*", "!.env.example", "/core.[0-9]*", "/.coverage", "/.coverage.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/virtualmoney"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/virtualmoney"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = ["unit: isolated unit tests", "integration: external dependency tests", "contract: public contract tests"]

[tool.coverage.run]
branch = true
source = ["virtualmoney"]
patch = ["subprocess"]

[tool.coverage.paths]
source = ["src/virtualmoney", "*/site-packages/virtualmoney"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
skip_covered = false
include_namespace_packages = true

[tool.coverage.json]
output = "coverage/coverage.json"

[tool.coverage.xml]
output = "coverage/coverage.xml"


[tool.uv.sources]
pypokerlost = { git = "ssh://git@github.com/pokerlost/pypokerlost.git", rev = "8652cc850ccef8a00538ba6ff0b545ff7f3d38af" }
