[project]
name = "virtual-money"
version = "0.1.0"
description = "Сервис внутренних игровых средств платформы онлайн-покера"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.8.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "uvicorn>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0,<2.0.0",
    "pre-commit>=4.2.0,<5.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_money"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]
extend-exclude = ["AGENTS.md"]

[tool.ruff.lint]
select = [
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]
ignore = ["RUF002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "alembic/env.py"]
exclude = ["alembic/versions"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false
