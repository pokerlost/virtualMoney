[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "virtualMoney"
version = "0.2.0"
description = "Pokerlost virtualMoney foundation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.38,<1", "pydantic-settings>=2.12,<3", "pypokerlost", "typer>=0.16,<1"]


[dependency-groups]
dev = ["mypy>=2.3,<3", "pre-commit>=4.2,<5", "ruff>=0.16,<1"]

[project.scripts]
virtualMoney = "virtualMoney.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/virtualMoney"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/virtualMoney"]

[tool.uv.sources]
pypokerlost = { git = "ssh://git@github.com/pokerlost/pypokerlost.git", rev = "8652cc850ccef8a00538ba6ff0b545ff7f3d38af" }
