name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact full reviewed SHA for the owner-reviewed private SDK build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/actionlint
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Restore public source-check tools without SDK credentials
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.source
          target: source
          load: true
          tags: virtualmoney:source
          cache-from: type=gha,scope=${{ github.repository_id }}-public-source-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-public-source-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - run: make source
      - name: Report the separate private acceptance boundary
        run: echo 'Source metadata/lint passed. B1 runtime, installed-wheel and Kind acceptance require the owner-dispatched privateBuild; this job does not verify B1.' >> "$GITHUB_STEP_SUMMARY"

  privateBuild:
    permissions:
      contents: read
      actions: read
    needs: source
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'serrja' && github.triggering_actor == 'serrja' && inputs.reviewed_sha == github.sha && inputs.reviewed_sha == vars.SDK_BUILD_REVIEWED_SHA && contains(fromJSON('["pokerlost/serviceTemplate","pokerlost/authService","pokerlost/accountsService","pokerlost/virtualMoney","pokerlost/pokerService","pokerlost/cryptoService"]'), github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require the approved solo-owner full-SHA policy before SDK access
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          ADMITTED_SHA: ${{ vars.SDK_BUILD_REVIEWED_SHA }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$REVIEWED_SHA" = "$ADMITTED_SHA"
          test "$GITHUB_ACTOR" = serrja
          test "$GITHUB_TRIGGERING_ACTOR" = serrja
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - name: Mint narrowly scoped, owner-admitted SDK read token
        id: sdkToken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.POKERLOST_SDK_APP_ID }}
          private-key: ${{ secrets.POKERLOST_SDK_APP_PRIVATE_KEY }}
          owner: pokerlost
          repositories: pypokerlost
          permission-contents: read
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Restore private quality tools and locked dependencies
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          target: quality
          load: true
          tags: virtualmoney:quality
          secrets: sdk_token=${{ steps.sdkToken.outputs.token }}
          cache-from: type=gha,scope=${{ github.repository_id }}-sdk-quality-python314-linux-amd64-owner
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-sdk-quality-python314-linux-amd64-owner
      - name: Fresh Docker lint, types and unit checks after cache restoration
        env:
          SDK_APP_TOKEN: ${{ steps.sdkToken.outputs.token }}
        run: make check QUALITY_NETWORK=host DOCKER_BUILD_ARGS='--secret id=sdk_token,env=SDK_APP_TOKEN'
      - name: Build canonical wheel and sdist
        env: {SDK_APP_TOKEN: '${{ steps.sdkToken.outputs.token }}'}
        run: make build DOCKER_BUILD_ARGS='--secret id=sdk_token,env=SDK_APP_TOKEN'
      - name: Build installed-wheel test image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          target: test
          platforms: linux/amd64
          load: true
          tags: virtualmoney:test
          secrets: sdk_token=${{ steps.sdkToken.outputs.token }}
          cache-from: type=gha,scope=${{ github.repository_id }}-sdk-test-python314-linux-amd64-owner
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-sdk-test-python314-linux-amd64-owner
      - name: Fresh installed-wheel and real PostgreSQL checks through Compose
        env: {SDK_APP_TOKEN: '${{ steps.sdkToken.outputs.token }}'}
        run: make verify DOCKER_BUILD_ARGS='--secret id=sdk_token,env=SDK_APP_TOKEN'
      - name: Build the runtime candidate once
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: virtualmoney:candidate
          secrets: sdk_token=${{ steps.sdkToken.outputs.token }}
          cache-from: type=gha,scope=${{ github.repository_id }}-sdk-runtime-python314-linux-amd64-owner
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-sdk-runtime-python314-linux-amd64-owner
      - name: Test runtime readiness, root/OpenAPI and graceful stop
        run: |
          set -euo pipefail
          container=""
          trap 'if [ -n "$container" ]; then docker rm -f "$container" >/dev/null; fi' EXIT
          docker image inspect --format='{{.Id}}' virtualmoney:candidate > dist/local-image-id.txt
          container="$(docker run --detach --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --network host \
            virtualmoney:candidate)"
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          curl --fail --silent http://127.0.0.1:8000/getOpenApi >/dev/null
          docker stop --time 15 "$container"
          test "$(docker inspect --format='{{.State.ExitCode}}' "$container")" = 0
      - uses: ./.github/actions/deployment-tools
      - name: Roll out the tested local image into disposable Kind
        run: |
          set -euo pipefail
          trap 'kind delete cluster --name virtualmoney-ci' EXIT
          kind create cluster --name virtualmoney-ci --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$RUNNER_TEMP/kubeconfig" --wait 180s
          kind load docker-image virtualmoney:candidate --name virtualmoney-ci
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl --context kind-virtualmoney-ci create namespace foundation
          helm upgrade --install virtualmoney deploy/chart --kube-context kind-virtualmoney-ci --namespace foundation --wait --timeout 120s --rollback-on-failure --values deploy/values.yaml --set image.repository=virtualmoney --set image.tag=candidate --set localDevelopment=true
          helm upgrade virtualmoney deploy/chart --kube-context kind-virtualmoney-ci --namespace foundation --reuse-values --set replicaCount=3 --wait --timeout 120s --rollback-on-failure
          helm rollback virtualmoney 1 --kube-context kind-virtualmoney-ci --namespace foundation --wait --timeout 120s
          test "$(kubectl --context kind-virtualmoney-ci -n foundation get deployment virtualmoney -o jsonpath='{.spec.replicas}')" = 2
          kubectl --context kind-virtualmoney-ci -n foundation port-forward --address=127.0.0.1 service/virtualmoney 18080:8000 > "$RUNNER_TEMP/forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null; kind delete cluster --name virtualmoney-ci' EXIT
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          helm package deploy/chart --destination dist
      - name: Preserve the tested local image without rebuilding
        run: docker save virtualmoney:candidate | gzip --no-name > dist/runtime-image.docker.tar.gz
      - name: Private candidate and coverage artifacts; no publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtualmoney-${{ inputs.reviewed_sha }}
          path: |
            coverage/
            dist/
          if-no-files-found: error
          retention-days: 14

  required:
    if: always()
    needs: [source, privateBuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require source checks and actual private acceptance on manual dispatch
        env:
          EVENT: ${{ github.event_name }}
          SOURCE_RESULT: ${{ needs.source.result }}
          PRIVATE_RESULT: ${{ needs.privateBuild.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          if [ "$EVENT" = workflow_dispatch ]; then
            test "$PRIVATE_RESULT" = success
          else
            test "$PRIVATE_RESULT" = skipped
          fi
