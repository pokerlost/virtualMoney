name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact full reviewed SHA for the environment-approved private SDK build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/actionlint
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install 3.14
      - name: Parse metadata and frozen lock without private credentials
        run: |
          python3 - <<'PYTHON'
          import tomllib
          from pathlib import Path
          for name in ('pyproject.toml', 'uv.lock'):
              with Path(name).open('rb') as source:
                  tomllib.load(source)
          PYTHON
      - run: uvx --from 'ruff==0.16.4' ruff check src tests
      - run: uvx --from 'ruff==0.16.4' ruff format --check src tests
      - run: '"$(uv python find 3.14)" -m compileall -q src'

  privateBuild:
    permissions:
      contents: read
      actions: read
    needs: source
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reviewed_sha == github.sha && contains(fromJSON('["pokerlost/serviceTemplate","pokerlost/authService","pokerlost/accountsService","pokerlost/virtualMoney","pokerlost/pokerService","pokerlost/cryptoService"]'), github.repository) }}
    environment: sdk-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require private destination and an existing reviewer-protected environment
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          gh api "repos/$GITHUB_REPOSITORY/environments/sdk-build" > "$RUNNER_TEMP/sdk-environment.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          environment = json.loads((Path(os.environ['RUNNER_TEMP']) / 'sdk-environment.json').read_text())
          rules = environment.get('protection_rules', [])
          assert any(rule['type'] == 'required_reviewers' and rule.get('reviewers') for rule in rules), 'Configure required environment review (the repository owner may review) before minting any SDK token'
          PYTHON
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install 3.14
      - name: Mint narrowly scoped, environment-approved SDK read token
        id: sdkToken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.POKERLOST_SDK_APP_ID }}
          private-key: ${{ secrets.POKERLOST_SDK_APP_PRIVATE_KEY }}
          owner: pokerlost
          repositories: pypokerlost
          permission-contents: read
      - name: Acquire the exact locked SDK with short-lived read access
        env:
          SDK_APP_TOKEN: ${{ steps.sdkToken.outputs.token }}
        run: |
          set -euo pipefail
          umask 077
          gitConfig="$RUNNER_TEMP/sdkGitConfig"
          askpass="$RUNNER_TEMP/sdkAskpass"
          trap 'rm -f "$gitConfig" "$askpass"' EXIT
          git config --file "$gitConfig" url."https://github.com/pokerlost/pypokerlost.git".insteadOf 'ssh://git@github.com/pokerlost/pypokerlost.git'
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$SDK_APP_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          export GIT_CONFIG_GLOBAL="$gitConfig" GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0 UV_NO_GITHUB_FAST_PATH=1
          uv sync --locked
      - name: Host types and real PostgreSQL tests without SDK credentials
        env:
          UV_OFFLINE: "true"
        run: make check
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build canonical wheel and sdist
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: artifacts
          platforms: linux/amd64
          outputs: type=local,dest=dist
          secrets: sdk_token=${{ steps.sdkToken.outputs.token }}
          cache-from: type=gha,scope=${{ github.repository_id }}-sdk-artifacts-linux-amd64-v2
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-sdk-artifacts-linux-amd64-v2
      - name: Build installed-wheel test image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: test
          platforms: linux/amd64
          load: true
          tags: virtualmoney:test
          secrets: sdk_token=${{ steps.sdkToken.outputs.token }}
          cache-from: type=gha,scope=${{ github.repository_id }}-sdk-test-linux-amd64-v2
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-sdk-test-linux-amd64-v2
      - name: Fresh installed-wheel tests in a read-only container
        run: |
          set -euo pipefail
          mkdir -p coverage
          docker run --rm --read-only --network host --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --user "$(id -u):$(id -g)" --mount type=bind,source="$PWD/coverage",target=/checks/coverage \
            virtualmoney:test sh -ec 'python -m pytest --cov --cov-report=term-missing --cov-report=json --cov-report=xml -p no:cacheprovider'
      - name: Build the runtime candidate once
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: virtualmoney:candidate
          secrets: sdk_token=${{ steps.sdkToken.outputs.token }}
          cache-from: type=gha,scope=${{ github.repository_id }}-sdk-runtime-linux-amd64-v2
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-sdk-runtime-linux-amd64-v2
      - name: Test runtime readiness, root/OpenAPI and graceful stop
        run: |
          set -euo pipefail
          container=""
          trap 'if [ -n "$container" ]; then docker rm -f "$container" >/dev/null; fi' EXIT
          docker image inspect --format='{{.Id}}' virtualmoney:candidate > dist/local-image-id.txt
          container="$(docker run --detach --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --network host \
            virtualmoney:candidate)"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          curl --fail --silent http://127.0.0.1:8000/getOpenApi >/dev/null
          docker stop --time 15 "$container"
          test "$(docker inspect --format='{{.State.ExitCode}}' "$container")" = 0
      - uses: ./.github/actions/deployment-tools
      - name: Roll out the tested local image into disposable Kind
        run: |
          set -euo pipefail
          trap 'kind delete cluster --name virtualmoney-ci' EXIT
          kind create cluster --name virtualmoney-ci --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$RUNNER_TEMP/kubeconfig" --wait 180s
          kind load docker-image virtualmoney:candidate --name virtualmoney-ci
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl --context kind-virtualmoney-ci create namespace foundation
          helm upgrade --install virtualmoney deploy/chart --kube-context kind-virtualmoney-ci --namespace foundation --wait --timeout 120s --rollback-on-failure --values deploy/values.yaml --set image.repository=virtualmoney --set image.tag=candidate --set localDevelopment=true
          helm upgrade virtualmoney deploy/chart --kube-context kind-virtualmoney-ci --namespace foundation --reuse-values --set replicaCount=3 --wait --timeout 120s --rollback-on-failure
          helm rollback virtualmoney 1 --kube-context kind-virtualmoney-ci --namespace foundation --wait --timeout 120s
          test "$(kubectl --context kind-virtualmoney-ci -n foundation get deployment virtualmoney -o jsonpath='{.spec.replicas}')" = 2
          kubectl --context kind-virtualmoney-ci -n foundation port-forward --address=127.0.0.1 service/virtualmoney 18080:8000 > "$RUNNER_TEMP/forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null; kind delete cluster --name virtualmoney-ci' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          helm package deploy/chart --destination dist
      - name: Preserve the tested local image without rebuilding
        run: docker save virtualmoney:candidate | gzip --no-name > dist/runtime-image.docker.tar.gz
      - name: Private candidate and coverage artifacts; no publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtualmoney-${{ inputs.reviewed_sha }}
          path: |
            coverage/
            dist/
          if-no-files-found: error
          retention-days: 14

  required:
    if: always()
    needs: [source, privateBuild]
    runs-on: ubuntu-24.04
    steps:
      - name: Require source and actual private runtime verification
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PYTHON
