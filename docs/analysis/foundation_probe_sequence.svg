  <rect x="350" y="112" width="220" height="48" rx="8" fill="#e7eefb" stroke="#9ab2da" />
  <text x="460" y="142" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#172b4d" text-anchor="middle" font-weight="600">FastAPI application</text>
  <line x1="460" y1="160" x2="460" y2="906" stroke="#aab8ca" stroke-width="1.5" stroke-dasharray="5 5" />
  <rect x="680" y="112" width="220" height="48" rx="8" fill="#e7eefb" stroke="#9ab2da" />
  <text x="790" y="142" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#172b4d" text-anchor="middle" font-weight="600">Lifespan resources</text>
  <line x1="790" y1="160" x2="790" y2="906" stroke="#aab8ca" stroke-width="1.5" stroke-dasharray="5 5" />
  <rect x="1000" y="112" width="220" height="48" rx="8" fill="#e7eefb" stroke="#9ab2da" />
  <text x="1110" y="142" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#172b4d" text-anchor="middle" font-weight="600">OpenAPI generator</text>
  <line x1="1110" y1="160" x2="1110" y2="906" stroke="#aab8ca" stroke-width="1.5" stroke-dasharray="5 5" />
  <rect x="451" y="196" width="18" height="696" fill="#d9e6ff" stroke="#98b4e8" />
  <rect x="781" y="236" width="18" height="656" fill="#def0ea" stroke="#9bc6b8" />
  <rect x="1101" y="690" width="18" height="62" fill="#ede5fb" stroke="#bfabd9" />
  <line x1="150" y1="207" x2="451" y2="207" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrow)" />
  <text x="300.5" y="198" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="400">Start process / enter lifespan</text>
