<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title description">
  <title id="title">virtualMoney foundation readiness and interface discovery</title>
  <desc id="description">AS-IS sequence for local lifespan, health probes, the canonical public root, and the unmodified OpenAPI document. No database or financial operations.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="context-stroke" />
    </marker>
  </defs>
  <rect width="1280" height="1040" fill="#f7f9fc" />
  <text x="40" y="45" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172b4d" text-anchor="start" font-weight="700">Foundation readiness and interface discovery</text>
  <text x="40" y="76" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#475569" text-anchor="start" font-weight="400">AS-IS · virtualMoney · local process profile · no financial operations or database</text>
  <rect x="40" y="112" width="220" height="48" rx="8" fill="#e7eefb" stroke="#9ab2da" />
  <text x="150" y="142" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#172b4d" text-anchor="middle" font-weight="600">Local runner / operator</text>
