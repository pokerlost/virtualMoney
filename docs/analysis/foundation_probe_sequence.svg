  <text x="625.0" y="239" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="400">ApplicationResources(ready=True)</text>
  <line x1="150" y1="304" x2="451" y2="304" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrow)" />
  <text x="300.5" y="295" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="400">GET /health/live</text>
  <line x1="451" y1="342" x2="150" y2="342" stroke="#526579" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4" />
  <text x="300.5" y="333" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#526579" text-anchor="middle" font-weight="400">200 {"status": "alive"}</text>
  <line x1="150" y1="395" x2="451" y2="395" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrow)" />
  <text x="300.5" y="386" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="400">GET /health/ready</text>
  <line x1="469" y1="435" x2="781" y2="435" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrow)" />
  <text x="625.0" y="426" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="400">get_resources(): ready</text>
  <line x1="781" y1="473" x2="469" y2="473" stroke="#526579" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4" />
  <text x="625.0" y="464" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#526579" text-anchor="middle" font-weight="400">True</text>
  <line x1="451" y1="511" x2="150" y2="511" stroke="#526579" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4" />
  <text x="300.5" y="502" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#526579" text-anchor="middle" font-weight="400">200 {"status": "ready"}</text>
  <line x1="150" y1="567" x2="451" y2="567" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrow)" />
  <text x="300.5" y="558" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="400">GET /  [getRoot]</text>
  <line x1="451" y1="607" x2="150" y2="607" stroke="#526579" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4" />
  <text x="300.5" y="598" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#526579" text-anchor="middle" font-weight="400">200 PokerlostResponse[None]</text>
  <line x1="150" y1="660" x2="451" y2="660" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrow)" />
  <text x="300.5" y="651" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="400">GET /getOpenApi  [getOpenApi]</text>
  <line x1="469" y1="701" x2="1101" y2="701" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrow)" />
  <text x="785.0" y="692" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="400">application.openapi()</text>
  <line x1="1101" y1="742" x2="469" y2="742" stroke="#526579" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4" />
  <text x="785.0" y="733" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#526579" text-anchor="middle" font-weight="400">OpenAPI 3.1 document</text>
  <line x1="451" y1="783" x2="150" y2="783" stroke="#526579" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4" />
  <text x="300.5" y="774" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#526579" text-anchor="middle" font-weight="400">200 unmodified document</text>
  <line x1="150" y1="841" x2="451" y2="841" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrow)" />
  <text x="300.5" y="832" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="400">Stop process / exit lifespan</text>
  <line x1="469" y1="882" x2="781" y2="882" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrow)" />
  <text x="625.0" y="873" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="400">Remove application.state.resources</text>
  <rect x="40" y="932" width="1200" height="78" rx="8" fill="#ffffff" stroke="#ccd6e3" />
  <text x="59" y="957" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#172b4d" text-anchor="start" font-weight="400">Collection: only GET / and GET /getOpenApi, the two operations actually present in OpenAPI.</text>
  <text x="59" y="981" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#526579" text-anchor="start" font-weight="400">Health probes are source-derived and excluded from the schema. /metrics remains an internal scrape endpoint.</text>
</svg>